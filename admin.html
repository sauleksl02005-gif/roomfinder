<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administration — RoomFinder</title><link rel="stylesheet" href="/style.css"></head><body><header class="topbar"><a class="brand" href="/">Room<span>Finder</span><small> ADMIN</small></a><nav><a href="/">Voir le site</a><button id="logout" class="btn hidden" type="button">Déconnexion</button></nav></header><main class="admin-wrap"><section id="loginPanel" class="admin-card" style="max-width:460px;margin:55px auto"><span class="eyebrow">ESPACE SÉCURISÉ</span><h1>Administration</h1><p class="muted">Connectez-vous pour gérer les annonces et consulter les demandes.</p><form id="loginForm" class="detail-form"><input name="username" autocomplete="username" placeholder="Identifiant" required><input name="password" type="password" autocomplete="current-password" placeholder="Mot de passe" required><button class="btn">Se connecter</button></form><p id="loginError" class="muted"></p></section>
<section id="dashboard" class="hidden"><div class="admin-card"><span class="eyebrow">GESTION DES ANNONCES</span><h1 id="formTitle">Ajouter une chambre</h1><form id="roomForm" class="admin-grid" enctype="multipart/form-data"><input type="hidden" name="id"><input class="field" name="title" placeholder="Titre de l'annonce" required><input class="field" name="city" placeholder="Ville" required><input class="field" name="neighborhood" placeholder="Quartier"><input class="field" name="price" type="number" min="1" placeholder="Prix en FCFA" required><select class="field" name="duration" required><option value="">Durée</option><option>Jour</option><option>Semaine</option><option>Mois</option></select><input class="field" name="phone" placeholder="Téléphone de contact"><input class="field" name="address" placeholder="Adresse"><input class="field" name="latitude" placeholder="Latitude GPS"><input class="field" name="longitude" placeholder="Longitude GPS"><input class="field wide" name="amenities" placeholder="Équipements (ex. eau, électricité, douche)"><textarea class="field wide" name="description" rows="3" placeholder="Description"></textarea><label class="wide">Photos (JPEG, PNG ou WebP, 5 Mo max. chacune) <input class="field" type="file" name="photos" accept="image/jpeg,image/png,image/webp" multiple></label><label class="wide"><input type="checkbox" name="published" checked> Publier immédiatement</label><div class="wide" style="display:flex;gap:10px"><button class="btn" id="saveBtn">Enregistrer l'annonce</button><button class="btn hidden" type="button" id="cancelEdit" style="background:#718078">Annuler</button></div></form><p id="formMessage" class="muted"></p></div>
<div class="admin-card"><h2>Annonces enregistrées</h2><div id="adminRooms" class="admin-list">Chargement…</div></div><div class="admin-card"><h2>Messages reçus</h2><div id="messages" class="admin-list">Chargement…</div></div></section></main><div id="toast" class="toast"></div><script src="/admin.js" defer></script></body></html>
